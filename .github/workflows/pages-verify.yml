name: Deploy scanned Roadie Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: roadie-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: read

jobs:
  build:
    name: Roadie guide artifact scan
    outputs:
      publish: ${{ steps.source.outputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: .
          destination: ./_site

      - name: Verify the generated site contains guides
        run: test -n "$(find _site/athletes -type f -name index.html -print -quit)"

      - name: Install pinned TruffleHog
        shell: bash
        run: |
          tool_dir="$RUNNER_TEMP/trufflehog"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location --retry 3 --max-time 75 --proto '=https' \
            --output "$tool_dir/release.tar.gz" \
            https://github.com/trufflesecurity/trufflehog/releases/download/v3.100.1/trufflehog_3.100.1_linux_amd64.tar.gz
          echo "b2460688116f29ce33f1afe16d14fef3fa3db928e74ba55a6c9fed392c60ad69  $tool_dir/release.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/release.tar.gz" -C "$tool_dir" trufflehog

      - name: Scan staged Pages files for secrets
        shell: bash
        run: |
          if "$RUNNER_TEMP/trufflehog/trufflehog" filesystem _site --no-verification \
            --no-update --fail --fail-on-scan-errors --concurrency=2 >/dev/null 2>&1; then
            echo "No secret candidates found."
          else
            status=$?
            if [[ "$status" == 183 ]]; then
              echo "::error::A secret candidate was detected in the staged site."
            else
              echo "::error::The site secret scan could not complete (exit $status)."
            fi
            exit "$status"
          fi

      - name: Check the current Pages source
        id: source
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')
          case "$build_type" in
            workflow) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            legacy) echo "Pages is still publishing from its source branch." ;;
            *) echo "::error::Unexpected Pages source."; exit 1 ;;
          esac

      - name: Upload scanned Pages artifact
        if: steps.source.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy scanned Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
